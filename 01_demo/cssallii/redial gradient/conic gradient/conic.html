<!DOCTYPE html>
<html>
<head>
    <title>Conic Sections</title>
</head>
<body>
    <h1>Conic Sections</h1>

    <h2>Circle</h2>
    <p>Equation: x² + y² = r²</p>

    <h2>Parabola</h2>
    <p>Equation: y² = 4ax</p>

    <h2>Ellipse</h2>
    <p>Equation: x²/a² + y²/b² = 1</p>

    <h2>Hyperbola</h2>
    <p>Equation: x²/a² - y²/b² = 1</p>

    <table border="1">
        <tr>
            <th>Conic</th>
            <th></th>
        </tr>
        <tr>
            <td>Circle</td>
            <td>x² + y² = r²</td>
        </tr>
        <tr>
            <td>Parabola</td>
            <td>y² = 4ax</td>
        </tr>
        <tr>
            <td>Ellipse</td>
            <td>x²/a² + y²/b² = 1</td>
        </tr>
        <tr>
            <td>Hyperbola</td>
            <td>x²/a² - y²/b² = 1</td>
        </tr>
    </table>
</body>
</html>
