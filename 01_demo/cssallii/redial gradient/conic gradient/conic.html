<!DOCTYPE html>
<html>
<head>
<script>
body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.umbrella{
    position:relative;
}

.top{
    width:200px;
    height:100px;
    background:red;
    border-radius:100px 100px 0 0;
}

.handle{
    width:8px;
    height:150px;
    background:black;
    margin:auto;
}

.hook{
    width:40px;
    height:40px;
    border:8px solid black;
    border-top:none;
    border-right:none;
    border-radius:0 0 0 40px;
    margin-left:96px;
}
</script>
</head>
<body>

<div class="umbrella">
    <div class="top"></div>
    <div class="handle"></div>
    <div class="hook"></div>
</div>

</body>
</html>
